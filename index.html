<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эрик | Премиум Веб-Дизайн</title>
    <!-- Подключаем современный дизайнерский шрифт -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #ffffff, #f1f5f9);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.01);
            text-align: center;
            max-width: 480px;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(49, 151, 149, 0.08);
            border-color: rgba(49, 151, 149, 0.3);
        }

        .avatar-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 28px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: #f0fdfa;
            border: 1px solid #b2f5ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            transition: transform 0.5s ease;
        }

        .container:hover .avatar {
            transform: rotate(15deg) scale(1.05);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.03em;
        }

        .tag {
            display: inline-block;
            background: #e6fffa;
            color: #00a3c4;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 24px;
        }

        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .links-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            text-align: left;
            padding-left: 4px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: #334155;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background: #ffffff;
            border-color: #319795;
            color: #319795;
            transform: translateX(4px);
        }

        .arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
        }

        .link-item:hover .arrow {
            transform: translateX(2px);
        }

        .btn-main {
            display: block;
            background: #1e3a8a;
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.01em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }

        .btn-main:hover {
            background: #319795;
            box-shadow: 0 6px 20px rgba(49, 151, 149, 0.3);
        }

        .footer {
            margin-top: 32px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-wrap">
            <div class="avatar">⚡</div>
        </div>
        <h1>Эрик</h1>
        <div class="tag">Digital Designer</div>
        <p>Проектирую чистые, минималистичные интерфейсы и создаю эстетичный пользовательский опыт. Верю, что хороший дизайн — это как можно меньше дизайна.</p>
        
        <div class="links-title">Моё портфолио</div>
        <div class="links-grid">
            <a href="#" class="link-item">
                <span>🌐 Сайты и Сервисы</span>
                <span class="arrow">→</span>
            </a>
            <a href="#" class="link-item">
                <span>📱 Мобильные приложения</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <a href="https://t.me" target="_blank" class="btn-main">Обсудить проект</a>
    </div>

    <div class="footer">
        © 2026 • DESIGNED BY ERIC
    </div>

</body>
</html>
